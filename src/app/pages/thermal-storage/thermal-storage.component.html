<div class="storage-page">
  <!-- PURE ANIMATED THERMAL STORAGE STAGE (4 CONTAINERS: 2 FILLING ENERGY, 2 EMPTY) -->
  <div class="animated-storage-stage">
    
    <!-- Ambient Atmospheric Thermal Radiation (Left 2 Tanks Glowing) -->
    <div class="active-tanks-glow"></div>

    <!-- Complete 4-Tank Storage Complex -->
    <div class="storage-complex-layout">

      <!-- ============================================================
           OVERHEAD THERMAL SUPPLY MANIFOLD & PIPELINE SYSTEM
           ============================================================ -->
      <div class="overhead-manifold-system">
        <!-- Main Horizontal Pipe Header -->
        <div class="main-header-pipe">
          <div class="energy-flow-pulse active-flow"></div>
        </div>

        <!-- 4 Downward Feeder Inlets into Each Container -->
        <div class="pipe-feeders-row">
          <!-- Feeder 1: Charging into Tank 1 -->
          <div class="feeder-branch filling">
            <div class="branch-pipe">
              <span class="pulse-jet"></span>
            </div>
            <div class="flow-valve active"></div>
          </div>

          <!-- Feeder 2: Charging into Tank 2 -->
          <div class="feeder-branch filling">
            <div class="branch-pipe">
              <span class="pulse-jet alt"></span>
            </div>
            <div class="flow-valve active"></div>
          </div>

          <!-- Feeder 3: Closed (Empty Tank 3) -->
          <div class="feeder-branch empty">
            <div class="branch-pipe"></div>
            <div class="flow-valve closed"></div>
          </div>

          <!-- Feeder 4: Closed (Empty Tank 4) -->
          <div class="feeder-branch empty">
            <div class="branch-pipe"></div>
            <div class="flow-valve closed"></div>
          </div>
        </div>
      </div>

      <!-- ============================================================
           4 THERMAL STORAGE CONTAINERS (2 FILLING, 2 EMPTY)
           ============================================================ -->
      <div class="storage-containers-row">

        <!-- ------------------------------------------------------------
             CONTAINER 1: ACTIVELY FILLING WITH THERMAL ENERGY
             ------------------------------------------------------------ -->
        <div class="thermal-container tank-filling tank-1">
          <!-- Top Dome with Pressure Cap & Inlet Flange -->
          <div class="container-dome top">
            <div class="inlet-flange-active">
              <span class="flange-heat-glow"></span>
            </div>
            <div class="pressure-relief-valve"></div>
          </div>

          <!-- Main Cylindrical Vessel Body -->
          <div class="vessel-cylindrical-body">
            <!-- Steel Outer Reinforcement Bands -->
            <div class="vessel-shell-band b-top"></div>
            <div class="vessel-shell-band b-mid"></div>
            <div class="vessel-shell-band b-bot"></div>

            <!-- Transparent Viewing Core: Actively Surging Molten Energy -->
            <div class="vessel-liquid-chamber">
              <!-- Molten Influx Jet streaming from top -->
              <div class="influx-energy-stream"></div>

              <!-- Animated Liquid Energy Bath -->
              <div class="molten-liquid-volume level-filling-1">
                <!-- Liquid Surface Wave (Animated SVG) -->
                <svg class="liquid-surface-wave" viewBox="0 0 160 24" preserveAspectRatio="none">
                  <path class="wave-path-1" d="M0 12 Q 40 0, 80 12 T 160 12 V 24 H 0 Z" fill="#ff7a00"/>
                  <path class="wave-path-2" d="M0 14 Q 40 24, 80 14 T 160 14 V 24 H 0 Z" fill="#ff3d00" opacity="0.8"/>
                </svg>
                
                <!-- Molten Core Body with Rising Bubbles & Embers -->
                <div class="molten-core-mass">
                  <span class="energy-bubble eb-1"></span>
                  <span class="energy-bubble eb-2"></span>
                  <span class="energy-bubble eb-3"></span>
                  <span class="energy-bubble eb-4"></span>
                  <span class="energy-bubble eb-5"></span>
                </div>
              </div>

              <!-- Internal Thermal Radiation Shimmer -->
              <div class="chamber-thermal-shimmer"></div>
            </div>

            <!-- Vertical Level Glass Column -->
            <div class="sight-glass-column">
              <div class="sight-glass-fill fill-1"></div>
            </div>
          </div>

          <!-- Bottom Domed Base & Industrial Saddle Legs -->
          <div class="container-dome bottom"></div>
          <div class="container-support-legs">
            <span class="support-leg left"></span>
            <span class="drain-valve active"></span>
            <span class="support-leg right"></span>
          </div>
        </div>

        <!-- ------------------------------------------------------------
             CONTAINER 2: ACTIVELY FILLING WITH THERMAL ENERGY
             ------------------------------------------------------------ -->
        <div class="thermal-container tank-filling tank-2">
          <!-- Top Dome with Pressure Cap & Inlet Flange -->
          <div class="container-dome top">
            <div class="inlet-flange-active">
              <span class="flange-heat-glow alt"></span>
            </div>
            <div class="pressure-relief-valve"></div>
          </div>

          <!-- Main Cylindrical Vessel Body -->
          <div class="vessel-cylindrical-body">
            <div class="vessel-shell-band b-top"></div>
            <div class="vessel-shell-band b-mid"></div>
            <div class="vessel-shell-band b-bot"></div>

            <!-- Transparent Viewing Core: Actively Surging Molten Energy -->
            <div class="vessel-liquid-chamber">
              <div class="influx-energy-stream alt-stream"></div>

              <div class="molten-liquid-volume level-filling-2">
                <svg class="liquid-surface-wave" viewBox="0 0 160 24" preserveAspectRatio="none">
                  <path class="wave-path-1" d="M0 12 Q 40 22, 80 12 T 160 12 V 24 H 0 Z" fill="#ff9100"/>
                  <path class="wave-path-2" d="M0 14 Q 40 4, 80 14 T 160 14 V 24 H 0 Z" fill="#ff5722" opacity="0.85"/>
                </svg>

                <div class="molten-core-mass">
                  <span class="energy-bubble eb-2"></span>
                  <span class="energy-bubble eb-3"></span>
                  <span class="energy-bubble eb-5"></span>
                  <span class="energy-bubble eb-1"></span>
                  <span class="energy-bubble eb-4"></span>
                </div>
              </div>

              <div class="chamber-thermal-shimmer"></div>
            </div>

            <div class="sight-glass-column">
              <div class="sight-glass-fill fill-2"></div>
            </div>
          </div>

          <!-- Bottom Domed Base & Industrial Saddle Legs -->
          <div class="container-dome bottom"></div>
          <div class="container-support-legs">
            <span class="support-leg left"></span>
            <span class="drain-valve active"></span>
            <span class="support-leg right"></span>
          </div>
        </div>

        <!-- ------------------------------------------------------------
             CONTAINER 3: EMPTY (COLD / NOT SAVED FROM THIS TIME)
             ------------------------------------------------------------ -->
        <div class="thermal-container tank-empty tank-3">
          <!-- Top Dome with Pressure Cap (Cold) -->
          <div class="container-dome top">
            <div class="inlet-flange-cold"></div>
            <div class="pressure-relief-valve cold"></div>
          </div>

          <!-- Main Cylindrical Vessel Body (Hollow / Empty Steel) -->
          <div class="vessel-cylindrical-body empty-body">
            <div class="vessel-shell-band b-top"></div>
            <div class="vessel-shell-band b-mid"></div>
            <div class="vessel-shell-band b-bot"></div>

            <!-- Transparent Viewing Core: Empty Cold Metal Chamber -->
            <div class="vessel-liquid-chamber empty-chamber">
              <div class="hollow-depth-shadow"></div>
              <div class="empty-base-plate"></div>
            </div>

            <div class="sight-glass-column">
              <div class="sight-glass-fill empty"></div>
            </div>
          </div>

          <!-- Bottom Domed Base & Support Legs -->
          <div class="container-dome bottom"></div>
          <div class="container-support-legs">
            <span class="support-leg left"></span>
            <span class="drain-valve cold"></span>
            <span class="support-leg right"></span>
          </div>
        </div>

        <!-- ------------------------------------------------------------
             CONTAINER 4: EMPTY (COLD / NOT SAVED FROM THIS TIME)
             ------------------------------------------------------------ -->
        <div class="thermal-container tank-empty tank-4">
          <!-- Top Dome with Pressure Cap (Cold) -->
          <div class="container-dome top">
            <div class="inlet-flange-cold"></div>
            <div class="pressure-relief-valve cold"></div>
          </div>

          <!-- Main Cylindrical Vessel Body (Hollow / Empty Steel) -->
          <div class="vessel-cylindrical-body empty-body">
            <div class="vessel-shell-band b-top"></div>
            <div class="vessel-shell-band b-mid"></div>
            <div class="vessel-shell-band b-bot"></div>

            <!-- Transparent Viewing Core: Empty Cold Metal Chamber -->
            <div class="vessel-liquid-chamber empty-chamber">
              <div class="hollow-depth-shadow"></div>
              <div class="empty-base-plate"></div>
            </div>

            <div class="sight-glass-column">
              <div class="sight-glass-fill empty"></div>
            </div>
          </div>

          <!-- Bottom Domed Base & Support Legs -->
          <div class="container-dome bottom"></div>
          <div class="container-support-legs">
            <span class="support-leg left"></span>
            <span class="drain-valve cold"></span>
            <span class="support-leg right"></span>
          </div>
        </div>

      </div>

      <!-- Ground Shadows & Thermal Reflections -->
      <div class="ground-shadows-row">
        <div class="tank-shadow-slot hot-shadow"></div>
        <div class="tank-shadow-slot hot-shadow"></div>
        <div class="tank-shadow-slot cold-shadow"></div>
        <div class="tank-shadow-slot cold-shadow"></div>
      </div>

    </div>

  </div>
</div>
