<aside 
  class="left-sidebar" 
  [class.collapsed]="isCollapsed"
  [class.mobile-open]="isMobileOpen"
  aria-label="Admin Navigation Sidebar">

  <!-- Sidebar Header / Brand Mark -->
  <div class="sidebar-header">
    <div class="brand-wrapper">
      <div class="brand-icon-flame">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"></path>
        </svg>
      </div>
      <div class="brand-text" *ngIf="!isCollapsed">
        <div class="brand-title-row">
          <span class="brand-name">WEST<span class="brand-heat">HEAT</span></span>
          <span class="brand-badge">PRO</span>
        </div>
        <span class="brand-sub">THERMAL CONTROL PANEL</span>
      </div>
    </div>

    <!-- Toggle Collapse / Close button (Left Sidebar: points left to collapse, right to expand) -->
    <button 
      type="button" 
      class="sidebar-toggle-btn" 
      (click)="onToggle()" 
      [title]="isCollapsed ? 'Expand Menu' : 'Collapse Menu'">
      <!-- When expanded: arrow points left to collapse -->
      <svg *ngIf="!isCollapsed" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="15 18 9 12 15 6"></polyline>
      </svg>
      <!-- When collapsed: arrow points right to expand -->
      <svg *ngIf="isCollapsed" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="9 18 15 12 9 6"></polyline>
      </svg>
    </button>
  </div>

  <!-- Operational Status Bar -->
  <div class="operation-status-bar" *ngIf="!isCollapsed">
    <div class="status-indicator">
      <span class="live-pulse normal"></span>
      <span class="status-label">SYS 4.8.2 ACTIVE</span>
    </div>
    <span class="status-location">SECTOR WEST-09</span>
  </div>

  <!-- Main Navigation Scroll Area -->
  <div class="sidebar-content">
    <div class="nav-section-title" *ngIf="!isCollapsed">
      <span>MAIN NAVIGATION</span>
    </div>

    <nav class="nav-menu">
      <a 
        *ngFor="let item of navItems" 
        [routerLink]="item.route"
        (click)="selectNav(item)"
        class="nav-link"
        [class.active]="activeNavId === item.id"
        [title]="item.label">
        
        <!-- Icons -->
        <div class="nav-icon-box">
          <!-- Flame Icon -->
          <svg *ngIf="item.icon === 'flame'" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z"></path>
          </svg>
          <!-- Layers Icon -->
          <svg *ngIf="item.icon === 'layers'" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"></polygon>
            <polyline points="2 17 12 22 22 17"></polyline>
            <polyline points="2 12 12 17 22 12"></polyline>
          </svg>
          <!-- Activity / Sensor Icon -->
          <svg *ngIf="item.icon === 'activity'" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="22 12 18 12 15 21 9 3 6 12 2 12"></polyline>
          </svg>
          <!-- CPU / Equipment Icon -->
          <svg *ngIf="item.icon === 'cpu'" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="4" width="16" height="16" rx="2" ry="2"></rect>
            <rect x="9" y="9" width="6" height="6"></rect>
            <line x1="9" y1="1" x2="9" y2="4"></line>
            <line x1="15" y1="1" x2="15" y2="4"></line>
            <line x1="9" y1="20" x2="9" y2="23"></line>
            <line x1="15" y1="20" x2="15" y2="23"></line>
            <line x1="20" y1="9" x2="23" y2="9"></line>
            <line x1="20" y1="14" x2="23" y2="14"></line>
            <line x1="1" y1="9" x2="4" y2="9"></line>
            <line x1="1" y1="14" x2="4" y2="14"></line>
          </svg>
          <!-- Zap / Power Icon -->
          <svg *ngIf="item.icon === 'zap'" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <!-- Alert Triangle Icon -->
          <svg *ngIf="item.icon === 'alert-triangle'" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>
            <line x1="12" y1="9" x2="12" y2="13"></line>
            <line x1="12" y1="17" x2="12.01" y2="17"></line>
          </svg>
          <!-- Bar Chart Icon -->
          <svg *ngIf="item.icon === 'bar-chart-2'" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="18" y1="20" x2="18" y2="10"></line>
            <line x1="12" y1="20" x2="12" y2="4"></line>
            <line x1="6" y1="20" x2="6" y2="14"></line>
          </svg>
          <!-- Settings Icon -->
          <svg *ngIf="item.icon === 'settings'" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </div>

        <span class="nav-label" *ngIf="!isCollapsed">{{ item.label }}</span>

        <!-- Badge pill -->
        <span 
          *ngIf="item.badge && !isCollapsed" 
          class="badge" 
          [ngClass]="'badge-' + item.badgeColor">
          {{ item.badge }}
        </span>
      </a>
    </nav>

    <!-- Sidebar Mini Telemetry Widget (only if expanded) -->
    <div class="sidebar-telemetry-card" *ngIf="!isCollapsed">
      <div class="telemetry-card-header">
        <span class="widget-title">BOILER LOAD RATIO</span>
        <span class="widget-metric font-mono">88.2%</span>
      </div>
      
      <div class="progress-track">
        <div class="progress-fill" style="width: 88.2%"></div>
      </div>

      <div class="telemetry-stats-row">
        <div class="stat-col">
          <span class="stat-name">Core Temp</span>
          <span class="stat-val font-mono">748°C</span>
        </div>
        <div class="stat-col">
          <span class="stat-name">Pressure</span>
          <span class="stat-val font-mono">3.24 Bar</span>
        </div>
        <div class="stat-col">
          <span class="stat-name">Pump</span>
          <span class="stat-val font-mono" style="color: var(--status-normal)">ON</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Sidebar Footer: Operator Profile & Action -->
  <div class="sidebar-footer">
    <div class="operator-profile">
      <div class="operator-avatar">
        <span>SY</span>
        <span class="operator-dot"></span>
      </div>
      <div class="operator-info" *ngIf="!isCollapsed">
        <span class="operator-name">Suyash Engineer</span>
        <span class="operator-role">Lead Thermal Operator</span>
      </div>
      <button 
        *ngIf="!isCollapsed" 
        class="profile-action-btn" 
        title="Emergency Control Center">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="12" y1="8" x2="12" y2="12"></line>
          <line x1="12" y1="16" x2="12.01" y2="16"></line>
        </svg>
      </button>
    </div>
  </div>

</aside>
