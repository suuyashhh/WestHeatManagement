<div class="admin-shell">
  <!-- Top Navigation Header -->
  <header class="admin-topbar">
    <div class="topbar-left">
      <!-- Topbar Sidebar Collapse/Expand Toggle -->
      <button 
        type="button" 
        class="topbar-sidebar-toggle" 
        (click)="toggleSidebar()" 
        [title]="isSidebarCollapsed ? 'Expand sidebar' : 'Collapse sidebar'"
        aria-label="Toggle Sidebar Menu">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="3" y1="12" x2="21" y2="12"></line>
          <line x1="3" y1="6" x2="21" y2="6"></line>
          <line x1="3" y1="18" x2="21" y2="18"></line>
        </svg>
      </button>

      <!-- Brand Flame Logo + Title -->
      <div class="topbar-brand">
        <div class="brand-flame-icon">
          <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M8.5 14.5A2.5 2.5 0 0 0 11 12c0-1.38-.5-2-1-3-1.072-2.143-.224-4.054 2-6 .5 2.5 2 4.9 4 6.5 2 1.6 3 3.5 3 5.5a7 7 0 1 1-14 0c0-1.153.433-2.294 1-3a2.5 2.5 0 0 0 2.5 3z" fill="#f97316" stroke="#ea580c"></path>
          </svg>
        </div>
        <span class="brand-title">Waste Heat Management System</span>
      </div>
    </div>

    <!-- Topbar Right: Status & Clock -->
    <div class="topbar-right">
      <div class="system-status-indicator">
        <span class="status-dot"></span>
        <span class="status-text">System Online</span>
      </div>

      <div class="system-date-time">
        <svg class="calendar-icon" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        <span class="date-text">{{ currentTimeString || '12 Sep 2025  04:45 PM' }}</span>
      </div>
    </div>
  </header>

  <!-- Main Viewport Body & Left Sidebar Layout -->
  <div class="admin-body">
    <!-- LEFT SIDEBAR COMPONENT -->
    <app-sidebar [isCollapsed]="isSidebarCollapsed" [isMobileOpen]="isMobileSidebarOpen"
      (toggleCollapse)="toggleSidebar()" (closeMobile)="closeMobileSidebar()">
    </app-sidebar>

    <!-- Center / Right Main Routed Content -->
    <main class="admin-main-viewport">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
